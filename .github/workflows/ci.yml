name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker compose build --no-cache
      - name: Run tests inside the container
        run: docker compose run --rm kali-mcp-server python -m pytest tests/test_server.py tests/test_tools.py -q

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker compose build --no-cache
